name: cardgames-stream-overlay

services:
  app:
    build: .
    image: cardgames-stream-overlay:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - data:/data

  dev:
    profiles: ["dev"]
    image: node:24-slim
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      HOST: 0.0.0.0
      VITE_HOST: 0.0.0.0
      DATA_DIR: /data
      LOG_LEVEL: debug
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - dev-data:/data

volumes:
  data:
  node_modules:
  dev-data:
