name: cardgames-stream-overlay

services:
  dev:
    image: node:24-slim
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      HOST: 0.0.0.0
      VITE_HOST: 0.0.0.0
      DATA_DIR: /data
      LOG_LEVEL: debug
      CONTROL_TOKEN: ${CONTROL_TOKEN:-dev-control-token}
      OVERLAY_TOKEN: ${OVERLAY_TOKEN:-dev-overlay-token}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:5174:5174"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - data:/data

  app:
    profiles: ["prod"]
    build: .
    environment:
      CONTROL_TOKEN: ${CONTROL_TOKEN:?set CONTROL_TOKEN}
      OVERLAY_TOKEN: ${OVERLAY_TOKEN:?set OVERLAY_TOKEN}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/data

volumes:
  node_modules:
  data:
